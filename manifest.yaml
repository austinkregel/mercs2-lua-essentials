format: 2

shipment:
  name: ess
  title: Ess — Mercenaries 2 Lua essentials
  version: 0.8.0
  target: retail
  authors: [loganw234]
  description: >-
    Library only. Adds the `ess` and `ess_names` Lua modules, which Quartermaster's loader runs
    when gameplay becomes visible, and the Ess UI movies.
  license: MIT
  tags: [library, lua, ui]

supersedes:
  - { dest: on_load, file: 1_Ess.lua }
  - { dest: on_load, file: 2_EssNames.lua }

load:
  requires:
    - { shipment: lua-bridge, version: "^1.2.0" }

contributions:
  # Generated: CI and the release workflow copy dist/Ess.lua and dist/EssNames.lua here after
  # build/package.py. src/shipment/lua/ is gitignored; stage it before running qm locally.
  # Both are libraries: qm's loader runs each body when gameplay becomes visible (world.begin), where
  # Ess's OnLoad install ran it; `import` alone never runs a module. Ess.Names adopts __EssNamesDB on
  # its first lookup, so the two may finish loading in either order.
  - { kind: add_script, name: ess,       source: src/shipment/lua/ess.lua,       exports: [Ess, OnStateChange], load: { when: world.begin, in: [gameplay] } }
  - { kind: add_script, name: ess_names, source: src/shipment/lua/ess_names.lua, exports: [__EssNamesDB],       load: { when: world.begin, in: [gameplay] } }
  # Committed: extracted byte-exact from the retired data/vz-patch.wad.
  - { kind: add_movie, name: cbar,       movie: src/shipment/movies/cbar.gfx }
  - { kind: add_movie, name: chat,       movie: src/shipment/movies/chat.gfx }
  - { kind: add_movie, name: contracts,  movie: src/shipment/movies/contracts.gfx }
  - { kind: add_movie, name: cpanel,     movie: src/shipment/movies/cpanel.gfx }
  - { kind: add_movie, name: ess_ui,     movie: src/shipment/movies/ess_ui.gfx }
  - { kind: add_movie, name: forge,      movie: src/shipment/movies/forge.gfx }
  - { kind: add_movie, name: ui_bar,     movie: src/shipment/movies/ui_bar.gfx }
  - { kind: add_movie, name: ui_confirm, movie: src/shipment/movies/ui_confirm.gfx }
  - { kind: add_movie, name: ui_input,   movie: src/shipment/movies/ui_input.gfx }
  - { kind: add_movie, name: ui_list,    movie: src/shipment/movies/ui_list.gfx }
  - { kind: add_movie, name: ui_panel,   movie: src/shipment/movies/ui_panel.gfx }
  - { kind: add_movie, name: ui_toast,   movie: src/shipment/movies/ui_toast.gfx }
