name: CI

# Validate every push/PR to master: the build merges clean, the merged Lua actually PARSES (a stock
# luac5.1 -p syntax gate -- exactly the check that can't be run on the dev box, which has no Lua), and the
# release zip packages without error. Uploads the zip as a short-lived artifact so a build can be grabbed
# and tried without cutting a release. Then checks the Quartermaster Shipment (manifest.yaml): stages its
# generated Lua sources, installs the qm pinned in .github/qm-version, and runs qm lint and qm compile-lua.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1 (for the syntax gate)
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Build, syntax-check, and package
        run: |
          python3 build/merge.py
          luac5.1 -p dist/Ess.lua        # parse the merged chunk -- fails the build on any syntax error
          python3 build/manifest.py      # generate dist/ess.json (package.py bundles it into the zip)
          python3 build/nodes.py         # ess.json + api/nodes.overlay.json -> dist/nodes.json (+ generated JS)
          python3 build/package.py

      # The API drift gate. ess.json can't drift from src/ -- it's generated from it -- but the HAND-WRITTEN
      # surfaces can: the in-game console's REGISTRY, CAPABILITIES.md's tables, and each file's own header
      # comments. This fails the build if any of them names a function that isn't defined, which is otherwise
      # exactly the kind of divergence nobody notices until a beginner types something that doesn't exist.
      - name: API drift gate (docs vs. real functions)
        run: python3 build/manifest.py --check

      # The node overlay is hand-authored, so it CAN drift: a renamed function or parameter would leave the
      # editor offering a node that generates Lua calling something that no longer exists. Checked against
      # ess.json, same as everything else here.
      - name: Node overlay gate (hand-authored metadata vs. real signatures)
        run: python3 build/nodes.py --check

      # Executes the generated node definitions against a stubbed editor and asserts the LUA they produce --
      # crucially that a guid parameter is spliced raw rather than quoted, which is the difference between a
      # working node and one that silently does nothing.
      - name: Generated node behaviour
        run: node tools/test_nodes.js

      # The lua-bridge WebSocket result path, modelled end to end with no game: our wrapper -> a real tab in a
      # Lua string -> the bridge's JSON escaping -> JSON.parse -> the parsed result. The client drops
      # unparseable frames inside a catch, so a break here is SILENT (results just look like timeouts) --
      # which is precisely why it gets a test rather than a manual check.
      - name: Bridge WebSocket result handling
        run: node tools/test_bridge_client.js

      - name: Offline behavioral tests (pure namespaces + intent bundles)
        run: |
          python3 -m pip install --quiet lupa
          python3 tools/checkpure.py
          python3 tools/test_bundles.py
          # Ess.Spawn's load-bearing property is that ONE bad template in a roster spawns NOTHING -- a blank
          # template hard-crashes the engine past pcall, and validating lazily would half-apply the call
          # before dying. That, the roster cycling, the count cap and the placement separation are all pure
          # logic, so they are provable here rather than only in a game.
          python3 tools/test_spawn.py

      - name: Upload built zip
        uses: actions/upload-artifact@v4
        with:
          name: Ess-zip
          path: dist/Ess-*.zip
          retention-days: 14
          if-no-files-found: error

      # ---- The Quartermaster Shipment (manifest.yaml) ----------------------------------------------------
      # manifest.yaml's two add_script sources are generated, so they are copied into place before qm runs:
      # qm refuses a declared source that does not exist, even for lint. src/shipment/lua/ is gitignored.
      # A missing dist file fails here rather than being skipped (dist/EssNames.lua exists only when
      # package.py built it from data/names.json).
      - name: Stage the Shipment's Lua sources
        run: |
          set -euo pipefail
          mkdir -p src/shipment/lua
          for pair in "dist/Ess.lua:src/shipment/lua/ess.lua" "dist/EssNames.lua:src/shipment/lua/ess_names.lua"; do
            from="${pair%%:*}"
            to="${pair#*:}"
            if [ ! -f "$from" ]; then
              echo "::error::$from is missing, so $to cannot be staged for the Shipment"
              exit 1
            fi
            cp "$from" "$to"
            cmp "$from" "$to"
            echo "staged $from -> $to ($(wc -c < "$to") bytes)"
          done

      # `qm` ships as a prebuilt binary, so nothing here needs a Rust toolchain. The version comes from
      # .github/qm-version (shared with release.yml). The expected sha256 is read from GitHub's own record
      # of the release asset BEFORE downloading, so the check is against what the release claims to hold
      # rather than against the bytes that happened to arrive.
      - name: Install qm (version from .github/qm-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QM_VERSION="$(tr -d '[:space:]' < .github/qm-version)"
          case "$QM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/qm-version holds '$QM_VERSION', not a vX.Y.Z qm release tag"; exit 1 ;;
          esac
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest") \
            || { echo "::error::qm release $QM_VERSION was not found in $repo -- check .github/qm-version"; exit 1; }
          if [ -z "$want" ]; then
            echo "::error::$asset is not in qm $QM_VERSION -- check .github/qm-version"
            exit 1
          fi
          want=${want#sha256:}
          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification -- expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # Hermetic: no game install and no retail WADs. Gated on the EXIT CODE, not on what gets printed.
      - name: Lint the Shipment
        run: ./qm lint .

      # Compile both modules with the game's Lua compiler, each under its bare chunk name (the file stem:
      # ess, ess_names), and check each output's header. Stock luac5.1 -p above is a syntax check only.
      - name: Compile the Shipment's Lua modules
        run: ./qm compile-lua src/shipment/lua/ess.lua src/shipment/lua/ess_names.lua --out-dir _build/compile-lua

      - name: What was checked
        if: always()
        run: ./qm rules
